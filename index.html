<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Nigeria Photo Gallery</title>
<link rel="preload" as="image" href="photo-01.webp" type="image/webp" fetchpriority="high">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f5f0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:clamp(12px,3vw,28px) 0 40px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.2vw,24px)}figure{margin:0}.gallery figure:only-child{grid-column:1/-1;width:min(1040px,100%);justify-self:center}.photo{display:block;width:100%;height:auto;cursor:zoom-in;-webkit-tap-highlight-color:transparent}.lightbox{position:fixed;inset:0;display:none;place-items:center;background:#080808f5;padding:12px;z-index:10;cursor:zoom-out}.lightbox.open{display:grid}.lightbox img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}@media(max-width:700px){.wrap{width:calc(100% - 12px);padding:6px 0 24px}.gallery{grid-template-columns:1fr;gap:8px}.gallery figure:only-child{grid-column:auto;width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="gallery" aria-label="Nigeria travel photo gallery">
<figure><img id="p1" class="photo" src="photo-01.webp" width="1200" height="900" alt="Nigeria travel photograph" loading="eager" decoding="async" fetchpriority="high"></figure>
</section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo preview"><img id="lbimg" src="photo-01.webp" width="1200" height="900" alt="Nigeria travel photograph"></div>
<script>
const p=document.getElementById('p1'),l=document.getElementById('lightbox');
p.addEventListener('click',()=>{l.classList.add('open');document.documentElement.style.overflow='hidden'});
l.addEventListener('click',()=>{l.classList.remove('open');document.documentElement.style.overflow=''});
addEventListener('keydown',e=>{if(e.key==='Escape'){l.classList.remove('open');document.documentElement.style.overflow=''}});
</script>
</body>
</html>
